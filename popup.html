<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      width: 320px; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e; 
      color: #e0e0e0;
      padding: 16px;
    }
    h1 { font-size: 16px; margin-bottom: 4px; color: #fff; }
    .subtitle { font-size: 11px; color: #888; margin-bottom: 16px; }
    
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 10px 12px;
      background: #16213e;
      border-radius: 8px;
    }
    .toggle-row label { font-size: 14px; cursor: pointer; }
    
    .switch {
      position: relative; width: 44px; height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #444; border-radius: 24px;
      transition: .3s;
    }
    .slider:before {
      content: ""; position: absolute;
      height: 18px; width: 18px; left: 3px; bottom: 3px;
      background: white; border-radius: 50%;
      transition: .3s;
    }
    input:checked + .slider { background: #6c63ff; }
    input:checked + .slider:before { transform: translateX(20px); }
    
    .section { margin-bottom: 14px; }
    .section label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; }
    .section input {
      width: 100%; padding: 8px 10px;
      background: #16213e; border: 1px solid #2a2a4a;
      border-radius: 6px; color: #fff; font-size: 13px;
    }
    .section input:focus { outline: none; border-color: #6c63ff; }
    
    .status {
      font-size: 12px; color: #888; margin-top: 4px;
      min-height: 18px;
    }
    .status.success { color: #4ade80; }
    .status.warning { color: #fbbf24; }
    
    .debug-row { margin-top: 12px; }
    .debug-row label { font-size: 12px; color: #888; cursor: pointer; }
    
    .footer { margin-top: 16px; font-size: 10px; color: #555; text-align: center; }
  </style>
</head>
<body>
  <h1>🧠 M365 Model Selector</h1>
  <div class="subtitle">Auto-selects the best model in Copilot Chat</div>
  
  <div class="toggle-row">
    <label for="enabled">Auto-select enabled</label>
    <label class="switch">
      <input type="checkbox" id="enabled" checked>
      <span class="slider"></span>
    </label>
  </div>
  
  <div class="section">
    <label for="modelName">Target model name</label>
    <input type="text" id="modelName" value="GPT 5.5 Think Deeper" placeholder="e.g. GPT-5.5 Thinking">
  </div>
  
  <div class="section">
    <label>Status</label>
    <div id="status" class="status">Checking...</div>
  </div>
  
  <div class="debug-row">
    <label>
      <input type="checkbox" id="debug"> Debug logging
    </label>
  </div>
  
  <button id="reset" style="width:100%; margin-top:10px; padding:6px; background:#333; border:1px solid #555; border-radius:6px; color:#aaa; cursor:pointer; font-size:12px;">Reset & Reload</button>
  
  <div class="footer">M365 Model Selector v3.4</div>
  
  <script src="popup.js"></script>
</body>
</html>
